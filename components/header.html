<header>
    <nav class="nav-container">
        <div class="logo-container">
            <a href="#home" class="logo-link">
                <img src="assets/img/logo.jpg" alt="Logo" class="logo-img">
                <span class="logo-text">@angkol</span>
            </a>
        </div>
        <div class="menu-toggle" id="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href="#home" class="nav-item"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#about" class="nav-item"><i class="fas fa-user"></i> About</a></li>
            <li><a href="#projects" class="nav-item"><i class="fas fa-code"></i> Projects</a></li>
            <li><a href="#contact" class="nav-item"><i class="fas fa-envelope"></i> Contact</a></li>
        </ul>
    </nav>
    <div class="nav-background-gradient"></div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Toggle mobile menu
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks = document.getElementById('nav-links');
        
        menuToggle.addEventListener('click', function() {
            navLinks.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });
        
        // Add active class to current section
        const navItems = document.querySelectorAll('.nav-item');
        const sections = document.querySelectorAll('section');
        
        window.addEventListener('scroll', function() {
            let current = '';
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if(scrollY >= (sectionTop - 200)) {
                    current = section.getAttribute('id');
                }
            });
            
            navItems.forEach(item => {
                item.classList.remove('active');
                if(item.getAttribute('href').substring(1) === current) {
                    item.classList.add('active');
                }
            });
        });
    });
</script>
